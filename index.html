<!DOCTYPE html>
<html lang="en">
<head>
<meta property="og:title" content="hantavirus." />
<meta property="og:description" content="music playlist. no ads, downloadable" />
<meta property="og:image" content="ico.jpg" />
<meta property="og:url" content="https://aaronestaaron.github.io/hantavirus" />
<meta property="og:type" content="playlist" />
</head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hantavirus.</title>
	<link rel="icon" type="image/png" href="ico.jpg">
	
    <style>
        /* === def vars for every theme === */
        
        /* 1. light-blue (default) */
        body.theme-light-blue {
            --bg-body: #e0f7fa;
            --bg-player: #ffffff;
            --bg-item: #f0fafd;
            --bg-item-hover: #e1f5fe;
            --text-main: #0277bd;
            --text-sub: #546e7a;
            --accent: #03a9f4;
            --shadow: 0 8px 24px rgba(3, 169, 244, 0.15);
            --border: #b3e5fc;
            --btn-bg: #f5f5f5;
            --btn-text: #546e7a;
            --btn-border: #e0e0e0;
			--audio-scheme: light;
            --audio-bg: #f1f1f1;
        }

        /* 2. green-dark */
        body.theme-green-dark {
            --bg-body: #0c100d;
            --bg-player: #141a16;
            --bg-item: #1c241e;
            --bg-item-hover: #253329;
            --text-main: #e0e0e0;
            --text-sub: #8ea895;
            --accent: #1db954;
            --shadow: 0 8px 24px rgba(29, 185, 84, 0.2);
            --border: #253329;
            --btn-bg: #1c241e;
            --btn-text: #8ea895;
            --btn-border: #253329;
			--audio-scheme: dark;
            --audio-bg: #0b0f0c;
        }

        /* 3. red-dark */
        body.theme-red-dark {
            --bg-body: #120a0a;
            --bg-player: #1c1010;
            --bg-item: #291717;
            --bg-item-hover: #3b2020;
            --text-main: #e0e0e0;
            --text-sub: #b89393;
            --accent: #e53935;
            --shadow: 0 8px 24px rgba(229, 57, 53, 0.2);
            --border: #3b2020;
            --btn-bg: #291717;
            --btn-text: #b89393;
            --btn-border: #3b2020;
			--audio-scheme: dark;
            --audio-bg: #0f0808;
        }

        /* === main styling (with var ofc) === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .player-container {
            background-color: var(--bg-player);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
        }

        /* dropdown position  */
        .theme-selector-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 0.85em;
            color: var(--text-sub);
        }

        .theme-select {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--btn-border);
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            outline: none;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: var(--accent);
            font-weight: 800;
        }

        .now-playing {
            text-align: center;
            font-size: 1em;
            color: var(--text-main);
            margin-bottom: 5px;
            font-weight: bold;
        }

        .now-playing-artist {
            text-align: center;
            font-size: 0.9em;
            color: var(--text-sub);
            margin-bottom: 20px;
            height: 18px;
        }

        audio {
            width: 100%;
            margin-bottom: 15px;
			color-scheme: var(--audio-scheme); /* change internal theme (auto) */
            transition: all 0.3s ease;
        }
		
		audio::-webkit-media-controls-panel {
            background-color: var(--audio-bg); /* backgrond panel change */
            transition: background-color 0.3s ease;
        }

        .controls-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .control-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--btn-border);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
        }

        .control-btn.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }
        
        #wake-lock-btn {
            border-color: #ffd54f;
            color: #f57c00;
        }
        #wake-lock-btn.active {
            background-color: #ffca28;
            color: #ffffff;
            border-color: #ffca28;
        }

        /* Playlist */
        .playlist-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }

        .playlist::-webkit-scrollbar {
            width: 6px;
        }
        .playlist::-webkit-scrollbar-thumb {
            background-color: var(--border);
            border-radius: 3px;
        }

        .playlist li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: var(--bg-item);
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .playlist li:hover {
            background-color: var(--bg-item-hover);
            border-color: var(--border);
        }

        .playlist li.active {
            background-color: var(--accent);
            color: #ffffff;
        }

        .song-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            flex: 1;
        }

        .song-title {
            font-weight: 600;
        }

        .song-artist {
            font-size: 0.9em;
            color: var(--text-sub);
            padding-left: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }

        .playlist li.active .song-artist,
        .playlist li.active .song-title-wrapper span {
            color: #ffffff;
            opacity: 0.8;
        }

        .status-msg {
            text-align: center;
            color: var(--text-sub);
            font-style: italic;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body class="theme-light-blue">

<div class="player-container">
    <div class="theme-selector-container">
        <label for="theme-select">theme:</label>
        <select id="theme-select" class="theme-select">
            <option value="theme-light-blue">blu</option>
            <option value="theme-green-dark">geren but black</option>
            <option value="theme-red-dark">red but blakc</option>
        </select>
    </div>

    <h2>HANTABIRUSSSS</h2>
    <div class="now-playing" id="now-playing">selecting song...</div>
    <div class="now-playing-artist" id="now-playing-artist"></div>
    
    <audio id="audio-player" controls></audio>

    <div class="controls-container">
        <button id="shuffle-btn" class="control-btn">shuffle</button>
        <button id="repeat-btn" class="control-btn">repeat: off</button>
        <button id="wake-lock-btn" class="control-btn">keep awake: off</button>
    </div>

    <div class="playlist-header">
        <span>Title</span>
        <span>Artist</span>
    </div>
    
    <div id="status" class="status-msg">fetching data from GitHub...</div>
    <ul class="playlist" id="playlist"></ul>
</div>

<script>
    // ================= config =================
    const GITHUB_USER = 'aaronestaaron'; 
    const GITHUB_REPO = 'hantavirus';
    const FOLDER_PATH = ''; 
    // =============================================================

    const audioPlayer = document.getElementById('audio-player');
    const playlistElement = document.getElementById('playlist');
    const nowPlayingElement = document.getElementById('now-playing');
    const nowPlayingArtistElement = document.getElementById('now-playing-artist');
    const statusElement = document.getElementById('status');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const repeatBtn = document.getElementById('repeat-btn');
    const wakeLockBtn = document.getElementById('wake-lock-btn');
    const themeSelect = document.getElementById('theme-select');

    const supportedExtensions = ['.mp3', '.wav', '.ogg', '.m4a', '.mp4'];
    
    let songsList = [];
    let currentTrackIndex = 0;
    let isShuffle = false;
    let repeatMode = 'none'; 
    
    let wakeLockSentinel = null;
    let isKeepAwakeEnabled = false;

    // ================= logic =================
    function initTheme() {
        const savedTheme = localStorage.getItem('user-theme') || 'theme-light-blue';
        document.body.className = savedTheme;
        themeSelect.value = savedTheme;
    }

    themeSelect.addEventListener('change', (e) => {
        const selectedTheme = e.target.value;
        document.body.className = selectedTheme;
        localStorage.setItem('user-theme', selectedTheme); // Simpan pilihan di browser
    });
    
    // Jalankan inisialisasi tema paling awal
    initTheme();
    // =========================================================

    async function fetchMusicFiles() {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;
        
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch data. Check configuration.');
            
            const files = await response.json();
            
            songsList = files.filter(file => {
                if (file.type !== 'file') return false;
                const fileNameLower = file.name.toLowerCase();
                return supportedExtensions.some(ext => fileNameLower.endsWith(ext));
            });

            if (songsList.length === 0) {
                statusElement.innerText = "No music files found.";
                return;
            }

            statusElement.style.display = 'none';
            renderPlaylist(songsList);
            loadTrack(0);

        } catch (error) {
            statusElement.innerText = "Error: " + error.message;
            console.error(error);
        }
    }

    function parseSongData(filename) {
        const songNameClean = filename.replace(/\.[^/.]+$/, ""); 
        let artist = "Unknown Artist";
        let title = songNameClean;

        if (songNameClean.includes(" - ")) {
            const parts = songNameClean.split(" - ");
            artist = parts[0].trim();
            title = parts[1].trim();
        }
        return { title, artist };
    }

    function renderPlaylist(songs) {
        playlistElement.innerHTML = ''; 
        songs.forEach((song, index) => {
            const li = document.createElement('li');
            li.setAttribute('data-index', index);
            const { title, artist } = parseSongData(song.name);

            li.innerHTML = `
                <div class="song-title-wrapper">
                    <span style="font-size: 0.85em; font-weight:bold; opacity: 0.6;">${index + 1}</span>
                    <span class="song-title">${title}</span>
                </div>
                <span class="song-artist">${artist}</span>
            `;
            
            li.addEventListener('click', () => {
                currentTrackIndex = index;
                playTrack(currentTrackIndex);
            });

            playlistElement.appendChild(li);
        });
    }

    function loadTrack(index) {
        const song = songsList[index];
        const { title, artist } = parseSongData(song.name);
        
        audioPlayer.src = song.download_url;
        nowPlayingElement.innerText = title;
        nowPlayingArtistElement.innerText = artist;

        const allItems = playlistElement.querySelectorAll('li');
        allItems.forEach(item => item.classList.remove('active'));
        const activeItem = playlistElement.querySelector(`li[data-index="${index}"]`);
        if (activeItem) activeItem.classList.add('active');
    }

    function playTrack(index) {
        loadTrack(index);
        audioPlayer.play().catch(error => {
            console.log("Autoplay blocked.");
            statusElement.style.display = 'block';
            statusElement.innerText = "Click play to start.";
        });
        statusElement.style.display = 'none';
    }

    audioPlayer.addEventListener('ended', () => {
        if (repeatMode === 'one') {
            playTrack(currentTrackIndex);
        } else if (isShuffle) {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * songsList.length);
            } while (songsList.length > 1 && randomIndex === currentTrackIndex);
            currentTrackIndex = randomIndex;
            playTrack(currentTrackIndex);
        } else {
            if (currentTrackIndex < songsList.length - 1) {
                currentTrackIndex++;
                playTrack(currentTrackIndex);
            } else if (repeatMode === 'all') {
                currentTrackIndex = 0;
                playTrack(currentTrackIndex);
            } else {
                nowPlayingElement.innerText = "Playlist finished.";
                nowPlayingArtistElement.innerText = "";
            }
        }
    });

    shuffleBtn.addEventListener('click', () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle('active', isShuffle);
    });

    repeatBtn.addEventListener('click', () => {
        if (repeatMode === 'none') {
            repeatMode = 'all';
            repeatBtn.innerHTML = 'repeat: all';
            repeatBtn.classList.add('active');
        } else if (repeatMode === 'all') {
            repeatMode = 'one';
            repeatBtn.innerHTML = 'repeat: one';
            repeatBtn.classList.add('active');
        } else {
            repeatMode = 'none';
            repeatBtn.innerHTML = 'repeat: off';
            repeatBtn.classList.remove('active');
        }
    });

    // WAKE LOCK LOGIC
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLockSentinel = await navigator.wakeLock.request('screen');
                wakeLockSentinel.addEventListener('release', () => {
                    if (!isKeepAwakeEnabled) updateWakeLockUI(false);
                });
                updateWakeLockUI(true);
            } else {
                alert("Browser not supporting Wake Lock.");
                isKeepAwakeEnabled = false;
                updateWakeLockUI(false);
            }
        } catch (err) {
            isKeepAwakeEnabled = false;
            updateWakeLockUI(false);
        }
    }

    function releaseWakeLock() {
        if (wakeLockSentinel) {
            wakeLockSentinel.release();
            wakeLockSentinel = null;
        }
        updateWakeLockUI(false);
    }

    function updateWakeLockUI(active) {
        if (active) {
            wakeLockBtn.innerHTML = 'keep awake: on';
            wakeLockBtn.classList.add('active');
        } else {
            wakeLockBtn.innerHTML = 'keep awake: off';
            wakeLockBtn.classList.remove('active');
        }
    }

    wakeLockBtn.addEventListener('click', () => {
        isKeepAwakeEnabled = !isKeepAwakeEnabled;
        if (isKeepAwakeEnabled) requestWakeLock();
        else releaseWakeLock();
    });

    document.addEventListener('visibilitychange', async () => {
        if (wakeLockSentinel !== null && document.visibilityState === 'visible' && isKeepAwakeEnabled) {
            requestWakeLock();
        }
    });

    fetchMusicFiles();
</script>

</body>
</html>
