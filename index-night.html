<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hantavirus.</title>
    <link rel="icon" type="image/png" href="https://aaronestaaron.github.io/hantavirus/ico.jpg">
    <meta property="og:title" content="hantavirus." />
    <meta property="og:description" content="haha yes playlist/" />
    <meta property="og:image" content="https://aaronestaaron.github.io/hantavirus/ico.jpg" />
    <meta property="og:url" content="https://hantavirus.on.top" />
    <meta property="og:type" content="playlist" />
    <style>
        /* === def vars === */

        /* light-blue */
        body.theme-light-blue {
            --bg-body: #e0f7fa;
            --bg-player: #ffffff;
            --bg-item: #f0fafd;
            --bg-item-hover: #e1f5fe;
            --text-main: #0277bd;
            --text-sub: #546e7a;
            --accent: #03a9f4;
            --accent-rgb: 3, 169, 244;
            --shadow: 0 20px 60px rgba(3, 169, 244, 0.18);
            --border: #b3e5fc;
            --btn-bg: #f5f5f5;
            --btn-text: #546e7a;
            --btn-border: #e0e0e0;
            --audio-scheme: light;
            --audio-bg: #f1f1f1;
            --viz-bg: rgba(227, 242, 252, 0.55);
        }

        /* green-dark */
        body.theme-green-dark {
            --bg-body: #0c100d;
            --bg-player: #141a16;
            --bg-item: #1c241e;
            --bg-item-hover: #253329;
            --text-main: #e0e0e0;
            --text-sub: #8ea895;
            --accent: #1db954;
            --accent-rgb: 29, 185, 84;
            --shadow: 0 20px 60px rgba(29, 185, 84, 0.22);
            --border: #253329;
            --btn-bg: #1c241e;
            --btn-text: #8ea895;
            --btn-border: #253329;
            --audio-scheme: dark;
            --audio-bg: #0b0f0c;
            --viz-bg: rgba(20, 26, 22, 0.6);
        }

        /* red-dark */
        body.theme-red-dark {
            --bg-body: #120a0a;
            --bg-player: #1c1010;
            --bg-item: #291717;
            --bg-item-hover: #3b2020;
            --text-main: #e0e0e0;
            --text-sub: #b89393;
            --accent: #e53935;
            --accent-rgb: 229, 57, 53;
            --shadow: 0 20px 60px rgba(229, 57, 53, 0.22);
            --border: #3b2020;
            --btn-bg: #291717;
            --btn-text: #b89393;
            --btn-border: #3b2020;
            --audio-scheme: dark;
            --audio-bg: #0f0808;
            --viz-bg: rgba(28, 16, 16, 0.6);
        }

        /* pink-dark */
        body.theme-pink-dark {
            --bg-body: #120a0f;
            --bg-player: #1c1017;
            --bg-item: #291722;
            --bg-item-hover: #3d2132;
            --text-main: #fce4ec;
            --text-sub: #c29ba9;
            --accent: #e91e63;
            --accent-rgb: 233, 30, 99;
            --shadow: 0 20px 60px rgba(233, 30, 99, 0.28);
            --border: #3d2132;
            --btn-bg: #291722;
            --btn-text: #c29ba9;
            --btn-border: #3d2132;
            --audio-scheme: dark;
            --audio-bg: #10080d;
            --viz-bg: rgba(28, 16, 23, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            transition: background-color 0.4s ease, color 0.4s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .player-container {
            background-color: var(--bg-player);
            padding: 28px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 520px;
            border: 1px solid var(--border);
            transition: all 0.4s ease;
            position: relative;
        }

        .theme-selector-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-size: 0.75em;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .theme-select {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--btn-border);
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
            font-size: 0.95em;
            text-transform: none;
            letter-spacing: 0;
        }

        .theme-select:hover {
            border-color: var(--accent);
        }

        .theme-select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        h2 {
            text-align: center;
            margin: 0 0 18px 0;
            color: var(--accent);
            font-weight: 800;
            font-size: 1.85em;
            letter-spacing: -0.02em;
        }

        /* === visualizer === */
        .visualizer-wrap {
            position: relative;
            background: var(--viz-bg);
            border-radius: 18px;
            padding: 10px;
            margin-bottom: 18px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .visualizer-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 120%, rgba(var(--accent-rgb), 0.25), transparent 60%);
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #visualizer {
            width: 100%;
            height: 130px;
            display: block;
            position: relative;
            z-index: 1;
        }

        .now-playing {
            text-align: center;
            font-size: 1.15em;
            color: var(--text-main);
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.01em;
            min-height: 1.2em;
            word-break: break-word;
        }

        .now-playing-artist {
            text-align: center;
            font-size: 0.9em;
            color: var(--text-sub);
            margin-bottom: 18px;
            height: 18px;
            font-weight: 500;
        }

        audio {
            width: 100%;
            margin-bottom: 16px;
            color-scheme: var(--audio-scheme);
            transition: all 0.3s ease;
            border-radius: 12px;
        }

        audio::-webkit-media-controls-panel {
            background-color: var(--audio-bg);
            transition: background-color 0.3s ease;
        }

        .controls-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .control-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--btn-border);
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            letter-spacing: 0.02em;
        }

        .control-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .control-btn.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 6px 16px rgba(var(--accent-rgb), 0.35);
        }

        #wake-lock-btn {
            border-color: #ffd54f;
            color: #f57c00;
        }
        #wake-lock-btn.active {
            background-color: #ffca28;
            color: #ffffff;
            border-color: #ffca28;
            box-shadow: 0 6px 16px rgba(255, 202, 40, 0.4);
        }

        /* Playlist */
        .playlist-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.72em;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 280px;
            overflow-y: auto;
        }

        .playlist::-webkit-scrollbar {
            width: 6px;
        }
        .playlist::-webkit-scrollbar-track {
            background: transparent;
        }
        .playlist::-webkit-scrollbar-thumb {
            background-color: var(--border);
            border-radius: 3px;
        }
        .playlist::-webkit-scrollbar-thumb:hover {
            background-color: var(--accent);
        }

        .playlist li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            background-color: var(--bg-item);
            margin-bottom: 6px;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
            border: 1px solid transparent;
        }

        .playlist li:hover {
            background-color: var(--bg-item-hover);
            border-color: var(--border);
            transform: translateX(2px);
        }

        .playlist li.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 6px 16px rgba(var(--accent-rgb), 0.28);
        }

        .song-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .song-index {
            font-size: 0.8em;
            font-weight: 700;
            opacity: 0.55;
            min-width: 1.5em;
            text-align: right;
        }

        .song-title {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 0.88em;
            color: var(--text-sub);
            padding-left: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 42%;
        }

        .playlist li.active .song-artist,
        .playlist li.active .song-title-wrapper span {
            color: #ffffff;
            opacity: 0.92;
        }

        .status-msg {
            text-align: center;
            color: var(--text-sub);
            font-style: italic;
            font-size: 0.9em;
            margin-top: 8px;
        }

        /* mini equalizer for the active row */
        .eq-mini {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            margin-right: 4px;
        }
        .eq-mini span {
            display: block;
            width: 3px;
            background: #fff;
            border-radius: 1px;
            animation: eq 0.9s infinite ease-in-out;
        }
        .eq-mini span:nth-child(1) { animation-delay: -0.4s; height: 60%; }
        .eq-mini span:nth-child(2) { animation-delay: -0.2s; height: 100%; }
        .eq-mini span:nth-child(3) { animation-delay: 0s; height: 45%; }
        .playlist li.active .eq-mini { display: inline-flex; }
        @keyframes eq {
            0%, 100% { transform: scaleY(0.25); }
            50% { transform: scaleY(1); }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .player-container { padding: 20px; border-radius: 20px; }
            h2 { font-size: 1.55em; }
            .now-playing { font-size: 1.05em; }
            .visualizer-wrap { padding: 8px; }
            #visualizer { height: 110px; }
            .song-artist { max-width: 38%; }
        }
    </style>
</head>
<body class="theme-light-blue">

<div class="player-container">
    <div class="theme-selector-container">
        <label for="theme-select">theme:</label>
        <select id="theme-select" class="theme-select">
            <option value="theme-light-blue">blu</option>
            <option value="theme-green-dark">geren but black</option>
            <option value="theme-red-dark">red but blakc</option>
            <option value="theme-pink-dark">hello kitty hello</option>
        </select>
    </div>

    <h2>HANTABIRUSSSS</h2>

    <div class="visualizer-wrap" aria-hidden="true">
        <canvas id="visualizer" width="900" height="260"></canvas>
    </div>

    <div class="now-playing" id="now-playing">searchign song...</div>
    <div class="now-playing-artist" id="now-playing-artist"></div>

    <audio id="audio-player" controls crossorigin="anonymous"></audio>

    <div class="controls-container">
        <button id="shuffle-btn" class="control-btn">shuffle</button>
        <button id="repeat-btn" class="control-btn">repeat: no</button>
        <button id="wake-lock-btn" class="control-btn">keep awake: off</button>
    </div>

    <div class="playlist-header">
        <span>Title</span>
        <span>Artist</span>
    </div>

    <div id="status" class="status-msg">fetching data from github...</div>
    <ul class="playlist" id="playlist"></ul>
</div>

<script>
    // ================= github config =================
    const GITHUB_USER = 'aaronestaaron';
    const GITHUB_REPO = 'hantavirus';
    const FOLDER_PATH = '';
    // =============================================================

    const audioPlayer = document.getElementById('audio-player');
    const playlistElement = document.getElementById('playlist');
    const nowPlayingElement = document.getElementById('now-playing');
    const nowPlayingArtistElement = document.getElementById('now-playing-artist');
    const statusElement = document.getElementById('status');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const repeatBtn = document.getElementById('repeat-btn');
    const wakeLockBtn = document.getElementById('wake-lock-btn');
    const themeSelect = document.getElementById('theme-select');
    const visualizer = document.getElementById('visualizer');
    const vizCtx = visualizer.getContext('2d');

    const supportedExtensions = ['.mp3', '.wav', '.ogg', '.m4a', '.mp4'];
    const BASE_TITLE = 'hantavirus.';

    let songsList = [];
    let currentTrackIndex = 0;
    let isShuffle = false;
    let repeatMode = 'none';

    let wakeLockSentinel = null;
    let isKeepAwakeEnabled = false;

    /* =========================================================
       AUDIO VISUALIZER (Web Audio API + Canvas)
       ========================================================= */
    let audioContext = null;
    let analyser = null;
    let sourceNode = null;
    let freqData = null;
    let smoothed = null;
    let bufferLength = 0;

    function initAudioContext() {
        if (audioContext) return;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioContext = new AC();
            sourceNode = audioContext.createMediaElementSource(audioPlayer);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 128;
            analyser.smoothingTimeConstant = 0.78;
            sourceNode.connect(analyser);
            analyser.connect(audioContext.destination);
            bufferLength = analyser.frequencyBinCount;
            freqData = new Uint8Array(bufferLength);
            smoothed = new Float32Array(bufferLength);
        } catch (err) {
            console.warn('Visualizer unavailable:', err);
        }
    }

    function resumeAudioContext() {
        if (!audioContext) initAudioContext();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume().catch(() => {});
        }
    }

    function resizeCanvas() {
        const rect = visualizer.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        visualizer.width = Math.max(1, Math.floor(rect.width * dpr));
        visualizer.height = Math.max(1, Math.floor(rect.height * dpr));
        vizCtx.setTransform(1, 0, 0, 1, 0, 0);
        vizCtx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getAccentRgb() {
        const v = getComputedStyle(document.body).getPropertyValue('--accent-rgb').trim();
        return v || '3, 169, 244';
    }

    function roundRect(ctx, x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        r = Math.max(0, r);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    const BAR_COUNT = 56;

    function drawVisualizer() {
        requestAnimationFrame(drawVisualizer);
        const rect = visualizer.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        vizCtx.clearRect(0, 0, w, h);

        const accentRgb = getAccentRgb();
        const playing = analyser && !audioPlayer.paused && !audioPlayer.ended;

        if (playing) {
            analyser.getByteFrequencyData(freqData);
            for (let i = 0; i < bufferLength; i++) {
                smoothed[i] = smoothed[i] * 0.72 + freqData[i] * 0.28;
            }
        } else {
            // decay toward idle
            for (let i = 0; i < (smoothed ? smoothed.length : 0); i++) {
                smoothed[i] *= 0.9;
            }
        }

        const barWidth = (w / BAR_COUNT) * 0.55;
        const gap = (w / BAR_COUNT) * 0.45;
        const maxHeight = h * 0.78;
        const centerY = h * 0.5;

        const t = performance.now() / 1000;

        for (let i = 0; i < BAR_COUNT; i++) {
            let value;
            if (playing) {
                // map bar index to frequency bin (skip very low bins)
                const idx = Math.floor((i / BAR_COUNT) * (bufferLength * 0.85));
                value = (smoothed[idx] || 0) / 255;
            } else {
                // gentle idle wave
                const phase = Math.sin(t * 1.6 + i * 0.32) * 0.5 + 0.5;
                value = 0.04 + phase * 0.06;
            }

            const barH = Math.max(2, value * maxHeight + 2);
            const x = i * (barWidth + gap) + gap / 2;
            const y = centerY - barH / 2;

            // main bar gradient
            const grad = vizCtx.createLinearGradient(0, y, 0, y + barH);
            grad.addColorStop(0, `rgba(${accentRgb}, ${playing ? 0.95 : 0.35})`);
            grad.addColorStop(0.5, `rgba(${accentRgb}, ${playing ? 0.7 : 0.25})`);
            grad.addColorStop(1, `rgba(${accentRgb}, ${playing ? 0.3 : 0.1})`);
            vizCtx.fillStyle = grad;
            roundRect(vizCtx, x, y, barWidth, barH, barWidth / 2);
            vizCtx.fill();

            // soft glow when loud
            if (playing && value > 0.55) {
                vizCtx.shadowColor = `rgba(${accentRgb}, 0.6)`;
                vizCtx.shadowBlur = 12;
                vizCtx.fill();
                vizCtx.shadowBlur = 0;
            }

            // subtle mirror reflection
            const reflectH = Math.min(barH * 0.45, h - (y + barH) - 2);
            if (reflectH > 1) {
                const ry = y + barH + 2;
                const grad2 = vizCtx.createLinearGradient(0, ry, 0, ry + reflectH);
                grad2.addColorStop(0, `rgba(${accentRgb}, ${playing ? 0.35 : 0.12})`);
                grad2.addColorStop(1, `rgba(${accentRgb}, 0)`);
                vizCtx.fillStyle = grad2;
                roundRect(vizCtx, x, ry, barWidth, reflectH, barWidth / 2);
                vizCtx.fill();
            }
        }
    }
    drawVisualizer();

    // resume AudioContext on any user gesture (autoplay policy)
    ['click', 'touchstart', 'keydown'].forEach(evt => {
        document.addEventListener(evt, resumeAudioContext, { passive: true });
    });

    /* =========================================================
       DYNAMIC DOCUMENT TITLE
       ========================================================= */
    function updateDocumentTitle(title, artist) {
        const t = (title || '').trim();
        const a = (artist || '').trim();
        if (!t || t === 'searchign song...' || t === 'playlist finished.') {
            document.title = BASE_TITLE;
            return;
        }
        if (a && a !== 'unknown artist') {
            document.title = `\u266A ${t} \u2014 ${a} \u00B7 ${BASE_TITLE}`;
        } else {
            document.title = `\u266A ${t} \u00B7 ${BASE_TITLE}`;
        }
    }

    // reset title to base when tab regains focus & nothing is playing
    audioPlayer.addEventListener('pause', () => {
        // keep current song in title while paused (Spotify-like behaviour)
    });

    /* =========================================================
       THEME
       ========================================================= */
    function initTheme() {
        const savedTheme = localStorage.getItem('user-theme') || 'theme-light-blue';
        document.body.className = savedTheme;
        themeSelect.value = savedTheme;
    }

    themeSelect.addEventListener('change', (e) => {
        const selectedTheme = e.target.value;
        document.body.className = selectedTheme;
        localStorage.setItem('user-theme', selectedTheme);
    });

    initTheme();

    /* =========================================================
       PLAYLIST FETCH + RENDER
       ========================================================= */
    async function fetchMusicFiles() {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch data. Check configuration.');

            const files = await response.json();

            songsList = files.filter(file => {
                if (file.type !== 'file') return false;
                const fileNameLower = file.name.toLowerCase();
                return supportedExtensions.some(ext => fileNameLower.endsWith(ext));
            });

            if (songsList.length === 0) {
                statusElement.innerText = "No music files found.";
                return;
            }

            statusElement.style.display = 'none';
            renderPlaylist(songsList);
            loadTrack(0);

        } catch (error) {
            statusElement.innerText = "Error: " + error.message;
            console.error(error);
        }
    }

    function parseSongData(filename) {
        const songNameClean = filename.replace(/\.[^/.]+$/, "");
        let artist = "unknown artist";
        let title = songNameClean;

        if (songNameClean.includes(" - ")) {
            const parts = songNameClean.split(" - ");
            artist = parts[0].trim();
            title = parts[1].trim();
        }
        return { title, artist };
    }

    function renderPlaylist(songs) {
        playlistElement.innerHTML = '';
        songs.forEach((song, index) => {
            const li = document.createElement('li');
            li.setAttribute('data-index', index);
            const { title, artist } = parseSongData(song.name);

            li.innerHTML = `
                <div class="song-title-wrapper">
                    <span class="eq-mini" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span class="song-index">${index + 1}</span>
                    <span class="song-title">${escapeHtml(title)}</span>
                </div>
                <span class="song-artist">${escapeHtml(artist)}</span>
            `;

            li.addEventListener('click', () => {
                currentTrackIndex = index;
                playTrack(currentTrackIndex);
            });

            playlistElement.appendChild(li);
        });
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function loadTrack(index) {
        const song = songsList[index];
        const { title, artist } = parseSongData(song.name);

        audioPlayer.src = song.download_url;
        nowPlayingElement.innerText = title;
        nowPlayingArtistElement.innerText = artist;
        updateDocumentTitle(title, artist);

        const allItems = playlistElement.querySelectorAll('li');
        allItems.forEach(item => item.classList.remove('active'));
        const activeItem = playlistElement.querySelector(`li[data-index="${index}"]`);
        if (activeItem) activeItem.classList.add('active');
    }

    function playTrack(index) {
        loadTrack(index);
        resumeAudioContext();
        audioPlayer.play().catch(error => {
            console.log("Autoplay blocked.", error);
            statusElement.style.display = 'block';
            statusElement.innerText = "Click play to start.";
        });
        statusElement.style.display = 'none';
    }

    audioPlayer.addEventListener('ended', () => {
        if (repeatMode === 'one') {
            playTrack(currentTrackIndex);
        } else if (isShuffle) {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * songsList.length);
            } while (songsList.length > 1 && randomIndex === currentTrackIndex);
            currentTrackIndex = randomIndex;
            playTrack(currentTrackIndex);
        } else {
            if (currentTrackIndex < songsList.length - 1) {
                currentTrackIndex++;
                playTrack(currentTrackIndex);
            } else if (repeatMode === 'all') {
                currentTrackIndex = 0;
                playTrack(currentTrackIndex);
            } else {
                nowPlayingElement.innerText = "playlist finished.";
                nowPlayingArtistElement.innerText = "";
                updateDocumentTitle('', '');
            }
        }
    });

    shuffleBtn.addEventListener('click', () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle('active', isShuffle);
    });

    repeatBtn.addEventListener('click', () => {
        if (repeatMode === 'none') {
            repeatMode = 'all';
            repeatBtn.innerHTML = 'repeat: all';
            repeatBtn.classList.add('active');
        } else if (repeatMode === 'all') {
            repeatMode = 'one';
            repeatBtn.innerHTML = 'repeat: one';
            repeatBtn.classList.add('active');
        } else {
            repeatMode = 'none';
            repeatBtn.innerHTML = 'repeat: no';
            repeatBtn.classList.remove('active');
        }
    });

    // WAKE LOCK LOGIC
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLockSentinel = await navigator.wakeLock.request('screen');
                wakeLockSentinel.addEventListener('release', () => {
                    if (!isKeepAwakeEnabled) updateWakeLockUI(false);
                });
                updateWakeLockUI(true);
            } else {
                alert("Browser not supporting Wake Lock.");
                isKeepAwakeEnabled = false;
                updateWakeLockUI(false);
            }
        } catch (err) {
            isKeepAwakeEnabled = false;
            updateWakeLockUI(false);
        }
    }

    function releaseWakeLock() {
        if (wakeLockSentinel) {
            wakeLockSentinel.release();
            wakeLockSentinel = null;
        }
        updateWakeLockUI(false);
    }

    function updateWakeLockUI(active) {
        if (active) {
            wakeLockBtn.innerHTML = 'keep awake: on';
            wakeLockBtn.classList.add('active');
        } else {
            wakeLockBtn.innerHTML = 'keep awake: off';
            wakeLockBtn.classList.remove('active');
        }
    }

    wakeLockBtn.addEventListener('click', () => {
        isKeepAwakeEnabled = !isKeepAwakeEnabled;
        if (isKeepAwakeEnabled) requestWakeLock();
        else releaseWakeLock();
    });

    document.addEventListener('visibilitychange', async () => {
        if (wakeLockSentinel !== null && document.visibilityState === 'visible' && isKeepAwakeEnabled) {
            requestWakeLock();
        }
    });

    fetchMusicFiles();
</script>
