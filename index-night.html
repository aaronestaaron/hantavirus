<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script>
    // pasang data-theme SEBELUM render agar tidak ada flash tema salah (FOUC)
    (function () {
        var KEY = 'user-theme';
        var LIST = ['light','dark','oled','phosphor','mono','ember','crimson','mist','lagoon'];
        var saved = null;
        try { saved = localStorage.getItem(KEY); } catch (e) { /* storage bisa diblokir */ }
        if (LIST.indexOf(saved) < 0) {
            // kunjungan pertama mengikuti preferensi sistem
            saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', saved);
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hantavirus.</title>
    <link rel="icon" type="image/jpeg" href="https://aaronestaaron.github.io/hantavirus/ico.jpg">
    <meta property="og:title" content="hantavirus. - New-Exp" />
    <meta property="og:description" content="haha yes playlist/" />
    <meta property="og:image" content="https://aaronestaaron.github.io/hantavirus/ico.jpg" />
    <meta property="og:url" content="https://aaronestaaron.on.top" />
    <meta property="og:type" content="playlist" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =====================================================
           hantavirus. — redesign UI
           Prinsip: minimal, futuristik lewat struktur (hairline,
           grid tegas, angka indeks), satu warna aksen per tema.
           Semua warna/garis/permukaan HANYA lewat custom
           properties pada selector [data-theme="..."].
           ===================================================== */

        :root {
            --font-ui: 'Space Grotesk', 'IBM Plex Mono', ui-monospace, sans-serif;
            --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace;
        }

        /* ---------- tema 1/5: terang ---------- */
        [data-theme="light"] {
            color-scheme: light;
            --bg-body: #f4f4f0;
            --bg-panel: #fdfdfb;
            --bg-item: #efefe9;
            --bg-item-hover: #e8e8e0;
            --text-main: #191919;
            --text-sub: #5b5b55;
            --accent: #0b45d0;
            --accent-rgb: 11, 69, 208;
            --on-accent: #ffffff;
            --on-accent-rgb: 255, 255, 255;
            --border: #d8d8cf;
            --track-bg: #dcdcd3;
            --buffer-bg: #b9b9ac;
            --viz-bg: #fafaf5;
        }

        /* ---------- tema 2/5: gelap ---------- */
        [data-theme="dark"] {
            color-scheme: dark;
            --bg-body: #0d0e12;
            --bg-panel: #131519;
            --bg-item: #191c21;
            --bg-item-hover: #20242b;
            --text-main: #e9eae6;
            --text-sub: #9ba0a6;
            --accent: #58a6ff;
            --accent-rgb: 88, 166, 255;
            --on-accent: #0b111e;
            --on-accent-rgb: 11, 17, 30;
            --border: #262a31;
            --track-bg: #23272e;
            --buffer-bg: #3a414c;
            --viz-bg: #101216;
        }

        /* ---------- tema 3/5: OLED (hitam pekat) ---------- */
        [data-theme="oled"] {
            color-scheme: dark;
            --bg-body: #000000;
            --bg-panel: #000000;
            --bg-item: #0a0a0a;
            --bg-item-hover: #131313;
            --text-main: #f2f2f2;
            --text-sub: #9c9c9c;
            --accent: #a78bfa;
            --accent-rgb: 167, 139, 250;
            --on-accent: #150b26;
            --on-accent-rgb: 21, 11, 38;
            --border: #242424;
            --track-bg: #1e1e1e;
            --buffer-bg: #343434;
            --viz-bg: #000000;
        }

        /* ---------- tema 4/5: fosfor / terminal CRT ---------- */
        [data-theme="phosphor"] {
            color-scheme: dark;
            --bg-body: #010601;
            --bg-panel: #020a02;
            --bg-item: #041508;
            --bg-item-hover: #071d0c;
            --text-main: #8effb0;
            --text-sub: #3fbf6f;
            --accent: #4dfc83;
            --accent-rgb: 77, 252, 131;
            --on-accent: #01130a;
            --on-accent-rgb: 1, 19, 10;
            --border: #123b1e;
            --track-bg: #0d3519;
            --buffer-bg: #175225;
            --viz-bg: #031005;
        }

        /* ---------- tema 5/5: mono (grayscale) ---------- */
        [data-theme="mono"] {
            color-scheme: light;
            --bg-body: #efefef;
            --bg-panel: #f7f7f7;
            --bg-item: #e7e7e7;
            --bg-item-hover: #dedede;
            --text-main: #111111;
            --text-sub: #555555;
            --accent: #111111;
            --accent-rgb: 17, 17, 17;
            --on-accent: #ffffff;
            --on-accent-rgb: 255, 255, 255;
            --border: #cfcfcf;
            --track-bg: #d6d6d6;
            --buffer-bg: #b5b5b5;
            --viz-bg: #f2f2f2;
        }

        /* ---------- tema 6/9: ember (oranye-hitam) ---------- */
        [data-theme="ember"] {
            color-scheme: dark;
            --bg-body: #0b0806; --bg-panel: #120d09; --bg-item: #1a120b;
            --bg-item-hover: #241811; --text-main: #f5ede4; --text-sub: #a8917d;
            --accent: #ff6b1a; --accent-rgb: 255, 107, 26;
            --on-accent: #1a0d03; --on-accent-rgb: 26, 13, 3;
            --border: #2e2117; --track-bg: #241a11; --buffer-bg: #40301f;
            --viz-bg: #0e0a07;
        }

        /* ---------- tema 7/9: crimson (merah-hitam) ---------- */
        [data-theme="crimson"] {
            color-scheme: dark;
            --bg-body: #0c0507; --bg-panel: #130709; --bg-item: #1a0a0d;
            --bg-item-hover: #260e12; --text-main: #f7ecec; --text-sub: #a98689;
            --accent: #ff3b4e; --accent-rgb: 255, 59, 78;
            --on-accent: #1c0407; --on-accent-rgb: 28, 4, 7;
            --border: #2e1318; --track-bg: #250f13; --buffer-bg: #432026;
            --viz-bg: #0f0608;
        }

        /* ---------- tema 8/9: mist (abu-putih) ---------- */
        [data-theme="mist"] {
            color-scheme: light;
            --bg-body: #e6e7e8; --bg-panel: #f4f5f6; --bg-item: #ecedef;
            --bg-item-hover: #e2e3e6; --text-main: #16181a; --text-sub: #5a5f66;
            --accent: #2b2f33; --accent-rgb: 43, 47, 51;
            --on-accent: #ffffff; --on-accent-rgb: 255, 255, 255;
            --border: #c9ccd0; --track-bg: #d5d8dc; --buffer-bg: #afb4ba;
            --viz-bg: #eff0f2;
        }

        /* ---------- tema 9/9: lagoon (teal-hitam) ---------- */
        [data-theme="lagoon"] {
            color-scheme: dark;
            --bg-body: #04100e; --bg-panel: #071713; --bg-item: #0b201b;
            --bg-item-hover: #102a23; --text-main: #e2f2ec; --text-sub: #7fa79b;
            --accent: #2dd4a7; --accent-rgb: 45, 212, 167;
            --on-accent: #02110c; --on-accent-rgb: 2, 17, 12;
            --border: #10332b; --track-bg: #0c2a23; --buffer-bg: #1a473c;
            --viz-bg: #051511;
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            margin: 0;
            padding: clamp(14px, 4vw, 44px);
            transition: background-color 0.35s ease, color 0.35s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        ::selection { background-color: var(--accent); color: var(--on-accent); }

        .player-container {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 3px;
            width: 100%;
            max-width: 560px;
            margin: auto;
            padding: clamp(18px, 4vw, 34px);
            position: relative;
            z-index: 1;
            transition: background-color 0.35s ease, border-color 0.35s ease;
            animation: container-entry 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes container-entry {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* baris meta paling atas */
        .meta-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-sub);
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            transition: color 0.35s ease, border-color 0.35s ease;
        }
        .meta-row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta-row span:last-child { flex: 1; min-width: 0; text-align: right; }

        /* header: judul + switcher tema */
        .head-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 14px 18px;
            padding: 22px 0 8px;
        }

        h2 {
            margin: 0;
            font-weight: 700;
            font-size: clamp(1.5rem, 5vw, 1.95rem);
            letter-spacing: -0.02em;
            line-height: 1.05;
            text-transform: uppercase;
            color: var(--text-main);
            transition: color 0.35s ease;
        }

        .theme-selector-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-sub);
            transition: color 0.35s ease;
        }
        .theme-switch { display: flex; flex-wrap: wrap; gap: 4px; }
        .theme-btn {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 5px 8px;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }
        .theme-btn:hover { color: var(--text-main); border-color: var(--text-sub); }
        .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .theme-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }

        /* label seksi bernomor indeks */
        .section-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-sub);
            margin: 20px 0 12px;
            transition: color 0.35s ease;
        }
        .section-label .idx { color: var(--accent); font-weight: 600; }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border);
            transition: background-color 0.35s ease;
        }

        /* visualizer */
        .visualizer-wrap {
            position: relative;
            background: var(--viz-bg);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 10px;
            overflow: hidden;
            transition: background-color 0.35s ease, border-color 0.35s ease;
        }
        /* penanda sudut presisi */
        .visualizer-wrap::before,
        .visualizer-wrap::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 9px;
            pointer-events: none;
        }
        .visualizer-wrap::before { top: -1px; left: -1px; border-top: 1px solid var(--accent); border-left: 1px solid var(--accent); }
        .visualizer-wrap::after { bottom: -1px; right: -1px; border-bottom: 1px solid var(--accent); border-right: 1px solid var(--accent); }

        #visualizer { width: 100%; height: 140px; display: block; }

        /* info trek yang diputar */
        .now-playing {
            font-size: clamp(1.05rem, 3.4vw, 1.3rem);
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.25;
            color: var(--text-main);
            margin: 0;
            min-height: 1.3em;
            word-break: break-word;
            transition: color 0.35s ease;
        }
        .now-playing-artist {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-sub);
            height: 18px;
            margin: 6px 0 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.35s ease;
        }

        /* audio native tersembunyi (dikendalikan UI custom) */
        audio.hidden-audio {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            border: 0;
            padding: 0;
        }

        /* panel pemutar */
        .custom-player {
            background: var(--bg-item);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 16px 16px 14px;
            margin-top: 16px;
            transition: background-color 0.35s ease, border-color 0.35s ease;
        }

        .player-main-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 16px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-family: inherit;
            transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
        }
        .ctrl-btn:hover { color: var(--text-main); }
        .ctrl-btn:active { transform: scale(0.94); }
        .ctrl-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        .ctrl-btn-sm {
            width: 42px;
            height: 42px;
            border-radius: 2px;
            border: 1px solid transparent;
        }
        .ctrl-btn-sm:hover { border-color: var(--border); background-color: var(--bg-item-hover); }

        .ctrl-btn-main {
            width: 58px;
            height: 58px;
            border-radius: 2px;
            background-color: var(--accent);
            color: var(--on-accent);
        }
        .ctrl-btn-main:hover { transform: scale(1.03); }
        .ctrl-btn-main:active { transform: scale(0.96); }
        .ctrl-btn-main:disabled { opacity: 0.4; }
        .ctrl-btn-main:focus-visible { outline-offset: 4px; }

        .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }

        .time-text {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-sub);
            font-variant-numeric: tabular-nums;
            min-width: 42px;
            letter-spacing: 0.05em;
            transition: color 0.35s ease;
        }
        #current-time { text-align: left; }
        #duration-time { text-align: right; }

        .progress-track {
            position: relative;
            flex: 1;
            height: 22px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: none;
        }
        .progress-track:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

        .progress-track-rail {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--track-bg);
            transition: height 0.15s ease, background-color 0.35s ease;
        }
        .progress-track:hover .progress-track-rail,
        .progress-track.dragging .progress-track-rail { height: 4px; }

        .progress-buffered {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: var(--buffer-bg);
            transition: width 0.2s linear, background-color 0.35s ease;
        }

        .progress-filled {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.08s linear, background-color 0.35s ease;
        }

        .progress-thumb {
            position: absolute;
            width: 9px;
            height: 9px;
            background: var(--accent);
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%) rotate(45deg) scale(0);
            transition: transform 0.18s ease, background-color 0.35s ease;
            pointer-events: none;
        }
        .progress-track:hover .progress-thumb,
        .progress-track.dragging .progress-thumb { transform: translate(-50%, -50%) rotate(45deg) scale(1); }

        .volume-row { display: flex; align-items: center; gap: 10px; }

        .ctrl-btn-xs { width: 34px; height: 34px; border-radius: 2px; }
        .ctrl-btn-xs:hover { background-color: var(--bg-item-hover); }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            max-width: 160px;
            height: 2px;
            background: var(--track-bg);
            outline: none;
            cursor: pointer;
            transition: background-color 0.35s ease;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 0;
            background: var(--accent);
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.35s ease;
        }
        .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.25); }
        .volume-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 0;
            background: var(--accent);
            border: none;
            cursor: pointer;
        }
        .volume-slider::-moz-range-track { height: 2px; background: var(--track-bg); border: none; }
        .volume-slider:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

        .spinner {
            display: block;
            width: 22px;
            height: 22px;
            border: 2px solid rgba(var(--on-accent-rgb), 0.35);
            border-top-color: var(--on-accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* mode: shuffle / repeat / keep awake */
        .controls-container { display: flex; flex-wrap: wrap; gap: 8px; }

        .control-btn {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 8px 14px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }
        .control-btn:hover { color: var(--text-main); border-color: var(--text-sub); }
        .control-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .control-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }

        /* tab playlist / library */
        .playlist-tabs { display: flex; border-bottom: 1px solid var(--border); transition: border-color 0.35s ease; }
        .playlist-tab {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            padding: 10px 12px;
            color: var(--text-sub);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease;
        }
        .playlist-tab:hover { color: var(--text-main); }
        .playlist-tab.active { color: var(--text-main); border-bottom-color: var(--accent); }
        .playlist-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

        /* toolbar aksi */
        .playlist-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .action-btn {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 6px 10px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.2s ease, border-color 0.2s ease;
        }
        .action-btn:hover { color: var(--text-main); border-color: var(--text-sub); }
        .action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .status-msg {
            font-family: var(--font-mono);
            text-align: center;
            color: var(--text-sub);
            font-size: 11px;
            letter-spacing: 0.06em;
            margin-top: 14px;
            transition: color 0.35s ease;
        }

        /* daftar lagu */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 12px 0 0;
            max-height: 300px;
            overflow-y: auto;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .playlist::-webkit-scrollbar { width: 4px; }
        .playlist::-webkit-scrollbar-track { background: transparent; }
        .playlist::-webkit-scrollbar-thumb { background-color: var(--border); }
        .playlist::-webkit-scrollbar-thumb:hover { background-color: var(--accent); }

        .playlist li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 11px 10px;
            background-color: transparent;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            position: relative;
            transition: background-color 0.18s ease;
            animation: item-enter 0.25s ease both;
        }
        .playlist li:last-child { border-bottom: none; }

        .playlist li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: var(--accent);
            transform: scaleY(0);

        .playlist li.active .eq-mini { display: inline-flex; }
        @keyframes eq {

    function computeBandRanges(rate, bins) {
        const binHz = (rate / 2) / bins;
        const ranges = [];
        for (let i = 0; i < VIZ_BAND_COUNT; i++) {
            const f0 = VIZ_FMIN * Math.pow(VIZ_FMAX / VIZ_FMIN, i / VIZ_BAND_COUNT);

            let s = Math.floor(f0 / binHz);
            let e = Math.ceil(f1 / binHz);
            if (e <= s) e = s + 1;      // jamin minimal 1 bin
            if (s < 0) s = 0;
            if (e > bins) e = bins;
            if (s >= bins) s = bins - 1;
            ranges.push([s, e]);

    // menginterpolasi from -> target BERBASIS TIMESTAMP (easeOutCubic, 600 ms) —

    const VIZ_BLEND_MS = 600;

    function parseHexToken(tok) {
        const c = tok.trim().replace('#', '');
        const n = c.length === 3 ? c.split('').map(x => x + x).join('') : c;
        return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16)];

    function readVizColors(name) {

            return {

                sub: t['--text-sub'] || parseHexToken(sub)

        return { accent: parseHexToken(accent), sub: parseHexToken(sub) };
    }
    function buildVizColorStrings(c) {
        const [ar, ag, ab] = c.accent;
        const [sr, sg, sb] = c.sub;
        return {
            subA16: 'rgba(' + sr + ',' + sg + ',' + sb + ',0.16)',
            subA55: 'rgba(' + sr + ',' + sg + ',' + sb + ',0.55)',
            barLive: 'rgba(' + ar + ',' + ag + ',' + ab + ',0.92)',
            barIdle: 'rgba(' + ar + ',' + ag + ',' + ab + ',0.35)'
        };
    }
    function lerpViz(a, b, t) { return a + (b - a) * t; }
    function lerpVizRgb(c1, c2, t) {
        return [lerpViz(c1[0], c2[0], t), lerpViz(c1[1], c2[1], t), lerpViz(c1[2], c2[2], t)];
    }

    let vizBlendTo = null;             // warna tema tujuan

    if (typeof MutationObserver !== 'undefined') {
        new MutationObserver(() => {
            // target = tabel tema BARU dari probe — bukan computed root, karena
            // root kini memegang nilai inline hasil blend (kondisi terkini)
            const next = readVizColors(document.documentElement.getAttribute('data-theme'));
            if (vizReducedMotion.matches) {
                // prefers-reduced-motion: langsung pakai warna baru, tanpa blend
                vizBlendFrom = null;
                vizBlendTo = null;
                vizCur = next;
                vizColorStrings = buildVizColorStrings(next);
                return;
            }
            // ganti tema beruntun di tengah blend: mulai dari kondisi interpolasi
            // TERKINI — tidak boleh ada lompatan warna sedikit pun
            stepVizBlend(performance.now());
            vizBlendFrom = { accent: vizCur.accent.slice(), sub: vizCur.sub.slice() };
            vizBlendTo = next;
            vizBlendStart = performance.now();
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    }

    // ---- cache ukuran kanvas via ResizeObserver (fallback window resize) ----
    let vizW = 1, vizH = 1, vizDpr = 1;
    function applyVizSize() {
        const rect = visualizer.getBoundingClientRect();   // di luar loop render
        vizDpr = window.devicePixelRatio || 1;
        vizW = Math.max(1, Math.floor(rect.width));
        vizH = Math.max(1, Math.floor(rect.height));
        visualizer.width = vizW * vizDpr;
        visualizer.height = vizH * vizDpr;
        vizCtx.setTransform(vizDpr, 0, 0, vizDpr, 0, 0);
    }
    if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(applyVizSize).observe(visualizer);
    }
    window.addEventListener('resize', applyVizSize);
    applyVizSize();

    function drawVisualizer() {
        requestAnimationFrame(drawVisualizer);
        const w = vizW, h = vizH;
        vizCtx.clearRect(0, 0, w, h);

        const nowMs = performance.now();
        const now = nowMs / 1000;
        const dt = Math.min(0.1, now - vizLastTime);
        vizLastTime = now;

        // interpolasi warna blend berbasis timestamp (identik di 30/60/144 Hz)
        if (stepVizBlend(nowMs)) vizColorStrings = buildVizColorStrings(vizCur);

        const playing = analyser && !audioPlayer.paused && !audioPlayer.ended;
        const reduced = vizReducedMotion.matches;
        const drawBars = (vizMode === 'bars' || vizMode === 'both') && bandRanges;
        const drawWave = (vizMode === 'wave' || vizMode === 'both');

        // ambil data audio bila aktif
        let hasAudio = false;
        if (playing && analyser) {
            try {
                analyser.getByteFrequencyData(freqData);
                if (drawWave) analyser.getByteTimeDomainData(timeData);   // HANYA saat mode wave/both
                hasAudio = true;
            } catch (e) {
                hasAudio = false;
            }
        }

        // ---- latar: hairline horizontal 25/50/75% + label frekuensi log ----
        vizCtx.lineWidth = 1;
        vizCtx.strokeStyle = vizColorStrings.subA16;
        for (let p = 0; p < 3; p++) {
            const y = Math.round(h * (0.25 + p * 0.25)) + 0.5;
            vizCtx.beginPath();
            vizCtx.moveTo(0, y);
            vizCtx.lineTo(w, y);
            vizCtx.stroke();
        }
        vizCtx.font = '9px "IBM Plex Mono", ui-monospace, monospace';
        vizCtx.fillStyle = vizColorStrings.subA55;
        vizCtx.textBaseline = 'bottom';
        const freqLabels = [60, 250, 1000, 4000, 16000];
        const logSpan = Math.log(VIZ_FMAX) - Math.log(VIZ_FMIN);
        for (let i = 0; i < freqLabels.length; i++) {
            const f = freqLabels[i];
            const t = (Math.log(f) - Math.log(VIZ_FMIN)) / logSpan;
            const x = Math.min(Math.round(t * w), w - 14);
            const label = f >= 1000 ? (f / 1000) + 'k' : String(f);
            vizCtx.fillText(label, x + 2, h - 2);
        }

        const slot = w / VIZ_BAND_COUNT;
        const barWidth = slot * 0.5;
        const gap = slot * 0.5;
        const maxHeight = h * 0.78;
        const centerY = h * 0.5;

        // ---- bars + peak-hold (memakai warna hasil blend yang sama) ----
        if (drawBars) {
            for (let i = 0; i < VIZ_BAND_COUNT; i++) {
                let value = 0;
                if (hasAudio) {
                    const r = bandRanges[i];
                    let max = 0;
                    for (let b = r[0]; b < r[1] && b < bufferLength; b++) {
                        const v = freqData[b];
                        if (v > max) max = v;
                    }
                    value = max / 255;
                } else if (!reduced) {
                    // idle: decay halus ke pola sine kecil
                    const phase = Math.sin(now * 1.6 + i * 0.32) * 0.5 + 0.5;
                    value = 0.04 + phase * 0.06;
                }
                // satu lapis ringan (0.6 lama / 0.4 baru)
                vizSmoothed[i] = vizSmoothed[i] * 0.6 + value * 0.4;
                const sv = vizSmoothed[i];

                // peak-hold, meluruh ~0.35/detik
                if (sv > vizPeaks[i]) vizPeaks[i] = sv;
                else vizPeaks[i] = Math.max(sv, vizPeaks[i] - 0.35 * dt);

                const barH = Math.max(2, sv * maxHeight + 2);
                const peakH = Math.max(2, vizPeaks[i] * maxHeight + 2);
                const x = i * slot + gap / 2;
                const y = centerY - barH / 2;
                vizCtx.fillStyle = hasAudio ? vizColorStrings.barLive : vizColorStrings.barIdle;
                vizCtx.fillRect(x, y, barWidth, barH);
                // cap 2px di atas & bawah pada ketinggian peak
                const peakY = centerY - peakH / 2;
                vizCtx.fillRect(x, peakY, barWidth, 2);
                vizCtx.fillRect(x, centerY + peakH / 2 - 2, barWidth, 2);
            }
        }

        // ---- wave (time-domain: resample 72 titik + kurva midpoint) ----
        if (drawWave) {
            const waveAmp = h * 0.3;
            if (hasAudio && timeData) {
                // resample: langkah tetap melintasi seluruh buffer fftSize; tiap
                // titik kontrol = rata-rata 4 sampel tetangga (peredam derau)
                const len = timeData.length;
                const stride = len / VIZ_WAVE_POINTS;
                for (let i = 0; i < VIZ_WAVE_POINTS; i++) {
                    const base = Math.floor(i * stride);
                    let sum = 0, n = 0;
                    for (let k = 0; k < VIZ_WAVE_GROUP; k++) {
                        const idx = base + k;
                        if (idx < len) { sum += timeData[idx]; n++; }
                    }
                    const v = (sum / n - 128) / 128;
                    // smoothing temporal per titik: 0.58 lama / 0.42 baru —
                    // inilah sumber kehalusan utama
                    vizWaveSmoothed[i] = vizWaveSmoothed[i] * 0.58 + v * 0.42;
                }
            } else if (reduced) {
                // prefers-reduced-motion: garis datar sempurna, tanpa animasi
                vizWaveSmoothed.fill(0);
            } else {
                // pause: gelombang idle sine amplitudo <= 2px, frekuensi rendah
                const idleAmp = 2 / waveAmp;
                for (let i = 0; i < VIZ_WAVE_POINTS; i++) {
                    const x01 = i / (VIZ_WAVE_POINTS - 1);
                    const target = Math.sin(now * 1.1 + x01 * Math.PI * 2) * idleAmp;
                    vizWaveSmoothed[i] = vizWaveSmoothed[i] * 0.58 + target * 0.42;
                }
            }

            // gambar dengan quadraticCurveTo (teknik midpoint): titik data sebagai
            // kontrol, tengah antar-titik sebagai anchor — bukan segmen lurus
            vizCtx.beginPath();
            vizCtx.lineWidth = 1.75;
            vizCtx.lineJoin = 'round';
            vizCtx.lineCap = 'round';
            vizCtx.strokeStyle = vizColorStrings.barLive;   // satu warna aksen hasil blend
            const waveX = (i) => (i / (VIZ_WAVE_POINTS - 1)) * w;
            const waveY = (i) => centerY + vizWaveSmoothed[i] * waveAmp;
            vizCtx.moveTo(waveX(0), waveY(0));
            for (let i = 1; i < VIZ_WAVE_POINTS - 1; i++) {
                vizCtx.quadraticCurveTo(waveX(i), waveY(i), (waveX(i) + waveX(i + 1)) / 2, (waveY(i) + waveY(i + 1)) / 2);
            }
            vizCtx.lineTo(waveX(VIZ_WAVE_POINTS - 1), waveY(VIZ_WAVE_POINTS - 1));
            vizCtx.stroke();
        }
    }
    drawVisualizer();

    // ---- listener global resume audio (tetap di blok ini) ----
    ['click', 'touchstart', 'keydown'].forEach(evt => {
        document.addEventListener(evt, resumeAudioContext, { passive: true });
    });

    // ---- tombol siklus mode visualizer (dibuat via JS, di luar .visualizer-wrap) ----
    (function setupVizModeButton() {
        const wrap = document.querySelector('.visualizer-wrap');
        if (!wrap || !wrap.parentNode) return;     // guard: elemen tak ditemukan
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'action-btn';
        btn.style.margin = '0 0 8px';
        btn.setAttribute('aria-pressed', 'false');
        btn.textContent = 'viz: bars';
        btn.addEventListener('click', () => {
            const idx = (VIZ_MODES.indexOf(vizMode) + 1) % VIZ_MODES.length;
            vizMode = VIZ_MODES[idx];
            btn.textContent = 'viz: ' + vizMode;
            btn.setAttribute('aria-pressed', vizMode === 'both' ? 'true' : 'false');
        });
        wrap.parentNode.insertBefore(btn, wrap);
    })();

    /* =========================================================
       DYNAMIC DOCUMENT TITLE
       ========================================================= */
    function updateDocumentTitle(title, artist) {
        const t = (title || '').trim();
        const a = (artist || '').trim();
        if (!t || t === 'searchign song...' || t === 'playlist finished.') {
            document.title = BASE_TITLE;
            return;
        }
        if (a && a !== 'unknown artist') {
            document.title = `${t} \u2014 ${a} \u00B7 ${BASE_TITLE}`;
        } else {
            document.title = `${t} \u00B7 ${BASE_TITLE}`;
        }
    }

    /* =========================================================
       THEME — [data-theme] pada <html>, 9 tema, tombol switcher
       ========================================================= */
    const THEME_KEY = 'user-theme';
    const themeButtons = document.querySelectorAll('.theme-btn');
    const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    /* ---- SISTEM BLEND WARNA SELURUH-UI (efek "timpa") ----
       Saat tema berganti, SEMUA custom property warna diinterpolasi dari
       kondisi TERKINI (bisa tengah blend tema sebelumnya) menuju tabel warna
       tema tujuan, berbasis TIMESTAMP (easeOutCubic, 600 ms) — fungsi murni
       dari (ts - start), hasil identik di 30/60/144 Hz. Klik beruntun
       secepat apa pun selalu menimpa dari campuran warna saat itu:
       tidak ada lompatan, tidak ada animasi yang dilewati. */
    const THEME_LERP_MS = 600;   // = VIZ_BLEND_MS: UI & visualizer seirama
    const THEME_COLOR_KEYS = [
        '--bg-body', '--bg-panel', '--bg-item', '--bg-item-hover',
        '--text-main', '--text-sub', '--accent', '--accent-rgb',
        '--on-accent', '--on-accent-rgb', '--border', '--track-bg',
        '--buffer-bg', '--viz-bg'
    ];

    // probe tersembunyi: membaca tabel warna tema TANPA terpengaruh nilai
    // inline hasil blend di <html> (deklarasi kaidenya sendiri menang
    // atas warisan) — dipasang sebelum interaksi pertama
    const THEME_PROBE = document.createElement('div');
    THEME_PROBE.style.display = 'none';
    document.body.appendChild(THEME_PROBE);

    function parseThemeColor(v) {
        if (!v) return null;
        if (v[0] === '#') return parseHexToken(v);        // '#rrggbb'
        const m = v.match(/\d+(?:\.\d+)?/g);            // 'r, g, b' | 'rgb(...)'
        return (m && m.length >= 3) ? [+m[0], +m[1], +m[2]] : null;
    }
    function themeColorTable(name) {
        THEME_PROBE.setAttribute('data-theme', name);
        const cs = getComputedStyle(THEME_PROBE);
        const out = {};
        for (const k of THEME_COLOR_KEYS) out[k] = parseThemeColor(cs.getPropertyValue(k).trim());
        return out;
    }
    function readCurrentColors() {
        const cs = getComputedStyle(document.documentElement);
        const out = {};
        for (const k of THEME_COLOR_KEYS) out[k] = parseThemeColor(cs.getPropertyValue(k).trim());
        return out;
    }
    function writeBlendColors(c) {
        const st = document.documentElement.style;
        for (const k of THEME_COLOR_KEYS) {
            const v = c[k];
            if (!v) continue;
            const s = Math.round(v[0]) + ', ' + Math.round(v[1]) + ', ' + Math.round(v[2]);
            st.setProperty(k, k.endsWith('-rgb') ? s : 'rgb(' + s + ')');
        }
    }
    function clearBlendColors() {
        const st = document.documentElement.style;
        for (const k of THEME_COLOR_KEYS) st.removeProperty(k);
    }

    let themeBlendFrom = null;   // titik awal blend = kondisi warna saat tema berganti
    let themeBlendTo = null;     // tabel warna tema tujuan
    let themeBlendStart = 0;     // timestamp (ms) saat blend dimulai
    let themeBlendRaf = 0;       // 0 = loop rAF tidak sedang berjalan

    function stepThemeBlend(ts) {
        if (!themeBlendFrom || !themeBlendTo) return false;
        const t = Math.min(Math.max(0, (ts - themeBlendStart) / THEME_LERP_MS), 1);
        const e = 1 - Math.pow(1 - t, 3);      // easeOutCubic — sama dengan viz
        const mix = {};
        for (const k of THEME_COLOR_KEYS) {
            const a = themeBlendFrom[k], b = themeBlendTo[k];
            mix[k] = (a && b)
                ? [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e, a[2] + (b[2] - a[2]) * e]
                : (b || a);
        }
        writeBlendColors(mix);
        if (t >= 1) {
            themeBlendFrom = null;
            themeBlendTo = null;
            // nilai atribut kini = target -> hapus nilai inline TANPA kilat
            // (kedua sumber bernilai sama); transisi CSS hidup kembali
            clearBlendColors();
            document.documentElement.classList.remove('theme-lerp');
            return false;
        }
        return true;
    }
    function themeBlendLoop(ts) {
        if (!stepThemeBlend(ts)) { themeBlendRaf = 0; return; }
        themeBlendRaf = requestAnimationFrame(themeBlendLoop);
    }

    function syncThemeButtons() {
        const current = document.documentElement.getAttribute('data-theme');
        themeButtons.forEach(btn => {
            const on = btn.dataset.setTheme === current;
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            btn.classList.toggle('active', on);
        });
    }

    function storeTheme(name) {
        try { localStorage.setItem(THEME_KEY, name); } catch (e) { /* storage bisa diblokir */ }
    }

    /* ---- denyut klik ganti tema (tetesan air) ----
       Dekoratif dan terpisah total dari mesin blend warna: sebuah titik
       tetesan menyala sekejap di titik klik (efek "plip"), lalu tiga riak
       hairline melebar makin lemah dan makin pelan — seperti gelombang di
       permukaan air. Warna = aksen tema TUJUAN. Klik beruntun: denyut lama
       dibatalkan, denyut baru dari titik klik terbaru (timpa — konsisten
       dengan perilaku blend warna). */
    let themePulseBox = null;
    let themePulseAnims = [];
    // riak: makin belakangan -> makin kecil, makin redup, makin pelan
    // (amplitudo gelombang air meredup menjauhi pusat tetesan)
    const PULSE_RIPPLE_SPEC = [
        { scaleTo: 1,    o0: 0.30, dur: 800, delay: 60  },
        { scaleTo: 0.72, o0: 0.19, dur: 760, delay: 200 },
        { scaleTo: 0.46, o0: 0.11, dur: 700, delay: 340 }
    ];
    const PULSE_DOT_SPEC = { dur: 340, delay: 0 };
    function fireThemePulse(x, y, target) {
        if (typeof x !== 'number' || typeof y !== 'number') return;  // panggilan programatik
        if (reducedMotionQuery.matches) return;                      // gerak minimal: tanpa denyut
        if (!themePulseBox) {
            themePulseBox = document.createElement('div');
            themePulseBox.id = 'theme-pulse';
            const dot = document.createElement('div');
            dot.className = 'pulse-dot';
            themePulseBox.appendChild(dot);                          // anak pertama = tetesan
            for (let i = 0; i < PULSE_RIPPLE_SPEC.length; i++) {
                const ring = document.createElement('div');
                ring.className = 'pulse-ring';
                themePulseBox.appendChild(ring);
            }
            document.body.appendChild(themePulseBox);
        }
        for (const a of themePulseAnims) { try { a.cancel(); } catch (err) {} }
        themePulseAnims = [];
        themePulseBox.style.transform = 'translate(' + x + 'px,' + y + 'px)';
        const rgb = (target && target['--accent']) ? target['--accent'] : null;
        const col = rgb ? 'rgb(' + Math.round(rgb[0]) + ',' + Math.round(rgb[1]) + ',' + Math.round(rgb[2]) + ')' : null;
        for (let i = 0; i < themePulseBox.children.length; i++) {
            const el = themePulseBox.children[i];
            const isDot = el.className === 'pulse-dot';
            const s = isDot ? PULSE_DOT_SPEC : (PULSE_RIPPLE_SPEC[i - 1] || PULSE_RIPPLE_SPEC[0]);
            if (col) {
                if (isDot) el.style.backgroundColor = col;   // tetesan: tinta warna aksen
                else el.style.borderColor = col;             // riak: hairline aksen
            }
            if (typeof el.animate !== 'function') continue;  // browser tua: tanpa denyut
            themePulseAnims.push(isDot
                ? el.animate(
                    [   // tetesan: menyala lalu melebur ke permukaan air
                        { transform: 'scale(0.55)', opacity: 0.55 },
                        { transform: 'scale(1)',    opacity: 0.18, offset: 0.6 },
                        { transform: 'scale(1.12)', opacity: 0 }
                    ],
                    { duration: s.dur, delay: s.delay, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
                )
                : el.animate(
                    [   // riak: kian melebar, kian redup
                        { transform: 'scale(0.12)', opacity: s.o0 },
                        { transform: 'scale(' + s.scaleTo + ')', opacity: 0 }
                    ],
                    { duration: s.dur, delay: s.delay, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
                )
            );
        }
    }

    function applyTheme(name, x, y) {
        const root = document.documentElement;
        if (root.getAttribute('data-theme') === name) { syncThemeButtons(); return; }

        const target = themeColorTable(name);
        if (!target || !target['--accent'] || reducedMotionQuery.matches) {
            // prefers-reduced-motion / tema tak terbaca: langsung, tanpa blend
            themeBlendFrom = null;
            themeBlendTo = null;
            if (themeBlendRaf) { cancelAnimationFrame(themeBlendRaf); themeBlendRaf = 0; }
            clearBlendColors();
            root.classList.remove('theme-lerp');
            root.setAttribute('data-theme', name);
            storeTheme(name);
            syncThemeButtons();
            return;
        }

        // denyut halus di titik klik — aksen tema TUJUAN; murni dekoratif,
        // tidak menyentuh jalur blend warna sama sekali
        fireThemePulse(x, y, target);

        // titik awal = warna kondisi TERKINI — bila blend sebelumnya masih
        // berjalan, nilainya adalah campuran tengah-jalan: tema baru MENIMPA
        // dari situ, bukan melompat (inilah perilaku yang diminta)
        const from = readCurrentColors();
        root.setAttribute('data-theme', name);   // sumber kebenaran + pemicu observer viz
        storeTheme(name);
        syncThemeButtons();

        // kunci tampilan pada kondisi terkini SEBELUM paint berikutnya agar
        // tukar atribut tidak menerjang layar; transisi CSS dimatikan sementara
        // supaya tidak animasi ganda dengan interpolasi JS ini
        root.classList.add('theme-lerp');
        writeBlendColors(from);
        themeBlendFrom = from;
        themeBlendTo = target;
        themeBlendStart = performance.now();
        if (!themeBlendRaf) themeBlendRaf = requestAnimationFrame(themeBlendLoop);
    }

    // tanpa lapisan snapshot View Transitions, klik tidak pernah tertelan —
    // workaround penerusan klik era themeVt tidak diperlukan lagi
    themeButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            applyTheme(btn.dataset.setTheme, e.clientX, e.clientY);
        });
    });

    syncThemeButtons();

    /* =========================================================
       TIME + PROGRESS HELPERS
       ========================================================= */
    function formatTime(seconds) {
        if (!seconds || isNaN(seconds) || !isFinite(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function updateProgressUI() {
        const dur = audioPlayer.duration;
        const cur = audioPlayer.currentTime;
        const pct = dur && !isNaN(dur) ? (cur / dur) * 100 : 0;
        if (!isSeeking) {
            progressFilled.style.width = pct + '%';
            progressThumb.style.left = pct + '%';
        }
        currentTimeEl.textContent = formatTime(cur);
        durationTimeEl.textContent = formatTime(dur);
        progressTrack.setAttribute('aria-valuenow', Math.round(pct));
        progressTrack.setAttribute('aria-valuetext', `${formatTime(cur)} of ${formatTime(dur)}`);
    }

    function updateBufferedUI() {
        const dur = audioPlayer.duration;
        if (dur && audioPlayer.buffered.length > 0) {
            const end = audioPlayer.buffered.end(audioPlayer.buffered.length - 1);
            const pct = Math.min(100, (end / dur) * 100);
            progressBuffered.style.width = pct + '%';
        }
    }

    function updateVolumeIcon() {
        const v = audioPlayer.volume;
        if (audioPlayer.muted || v === 0) {
            volumeIcon.outerHTML = ICON_VOL_MUTE;
        } else if (v < 0.5) {
            volumeIcon.outerHTML = ICON_VOL_LOW;
        } else {
            volumeIcon.outerHTML = ICON_VOL_HIGH;
        }
        // re-grab because outerHTML replaced the node
        window._volumeIcon = document.getElementById('volume-icon');
    }

    /* =========================================================
       CUSTOM PLAYER CONTROLS
       ========================================================= */
    function getCurrentSong() {
        if (playingLibraryIndex >= 0 && playingLibraryIndex < librarySongs.length) {
            return librarySongs[playingLibraryIndex];
        }
        if (currentTrackIndex >= 0 && currentTrackIndex < songsList.length) {
            return songsList[currentTrackIndex];
        }
        return null;
    }

    function setPlayingState(isPlaying) {
        if (isPlaying) {
            playBtnContent.innerHTML = ICON_PAUSE;
            playBtn.setAttribute('aria-label', 'Pause');
        } else {
            playBtnContent.innerHTML = ICON_PLAY;
            playBtn.setAttribute('aria-label', 'Play');
        }
        // refresh dynamic title
        const song = getCurrentSong();
        if (song) {
            const { title, artist } = parseSongData(song.name);
            updateDocumentTitle(title, artist);
        }
    }

    function setLoadingState(isLoading) {
        if (isLoading) {
            playBtnContent.innerHTML = SPINNER;
        } else {
            setPlayingState(!audioPlayer.paused);
        }
    }

    function togglePlay() {
        if (!songsList.length && playingLibraryIndex < 0) return;
        resumeAudioContext();
        if (audioPlayer.paused) {
            audioPlayer.play().catch(err => {
                console.log('Playback blocked:', err);
                statusElement.style.display = 'block';
                statusElement.innerText = 'Click play to start.';
            });
        } else {
            audioPlayer.pause();
        }
    }

    playBtn.addEventListener('click', togglePlay);

    prevBtn.addEventListener('click', () => {
        if (playingLibraryIndex >= 0) {
            // library playback mode
            if (audioPlayer.currentTime > 3) {
                audioPlayer.currentTime = 0;
            } else if (playingLibraryIndex > 0) {
                playFromLibrary(playingLibraryIndex - 1);
            } else {
                audioPlayer.currentTime = 0;
            }
            return;
        }
        if (!songsList.length) return;
        // if more than 3s in, restart current track; otherwise go to previous
        if (audioPlayer.currentTime > 3 && currentTrackIndex >= 0) {
            audioPlayer.currentTime = 0;
        } else if (currentTrackIndex > 0) {
            currentTrackIndex--;
            playTrack(currentTrackIndex);
        } else {
            audioPlayer.currentTime = 0;
        }
    });

    nextBtn.addEventListener('click', () => {
        if (playingLibraryIndex >= 0) {
            // library playback mode
            if (isShuffle) {
                let r;
                do { r = Math.floor(Math.random() * librarySongs.length); }
                while (librarySongs.length > 1 && r === playingLibraryIndex);
                playFromLibrary(r);
            } else if (playingLibraryIndex < librarySongs.length - 1) {
                playFromLibrary(playingLibraryIndex + 1);
            } else {
                playFromLibrary(0);
            }
            return;
        }
        if (!songsList.length) return;
        if (isShuffle) {
            let r;
            do { r = Math.floor(Math.random() * songsList.length); }
            while (songsList.length > 1 && r === currentTrackIndex);
            currentTrackIndex = r;
        } else if (currentTrackIndex < songsList.length - 1) {
            currentTrackIndex++;
        } else {
            currentTrackIndex = 0;
        }
        playTrack(currentTrackIndex);
    });

    // audio element events -> sync custom UI
    audioPlayer.addEventListener('play', () => { setPlayingState(true); statusElement.style.display = 'none'; });
    audioPlayer.addEventListener('pause', () => setPlayingState(false));
    audioPlayer.addEventListener('waiting', () => setLoadingState(true));
    audioPlayer.addEventListener('canplay', () => setLoadingState(false));
    audioPlayer.addEventListener('playing', () => setLoadingState(false));
    audioPlayer.addEventListener('timeupdate', updateProgressUI);
    audioPlayer.addEventListener('loadedmetadata', () => { updateProgressUI(); updateBufferedUI(); });
    audioPlayer.addEventListener('progress', updateBufferedUI);
    audioPlayer.addEventListener('volumechange', () => {
        volumeSlider.value = audioPlayer.muted ? 0 : audioPlayer.volume;
        updateVolumeIcon();
    });

    /* ---- seek bar (mouse + touch + keyboard) ---- */
    function seekToClientX(clientX) {
        const rect = progressTrack.getBoundingClientRect();
        let pct = (clientX - rect.left) / rect.width;
        pct = Math.max(0, Math.min(1, pct));
        progressFilled.style.width = (pct * 100) + '%';
        progressThumb.style.left = (pct * 100) + '%';
        if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
            audioPlayer.currentTime = pct * audioPlayer.duration;
            currentTimeEl.textContent = formatTime(pct * audioPlayer.duration);
        }
    }

    progressTrack.addEventListener('mousedown', (e) => {
        if (!audioPlayer.duration || isNaN(audioPlayer.duration)) return;
        isSeeking = true;
        progressTrack.classList.add('dragging');
        seekToClientX(e.clientX);
    });
    document.addEventListener('mousemove', (e) => {
        if (isSeeking) seekToClientX(e.clientX);
    });
    document.addEventListener('mouseup', () => {
        if (isSeeking) {
            isSeeking = false;
            progressTrack.classList.remove('dragging');
        }
    });

    progressTrack.addEventListener('touchstart', (e) => {
        if (!audioPlayer.duration || isNaN(audioPlayer.duration)) return;
        isSeeking = true;
        progressTrack.classList.add('dragging');
        if (e.touches[0]) seekToClientX(e.touches[0].clientX);
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
        if (isSeeking && e.touches[0]) seekToClientX(e.touches[0].clientX);
    }, { passive: true });
    document.addEventListener('touchend', () => {
        if (isSeeking) {
            isSeeking = false;
            progressTrack.classList.remove('dragging');
        }
    });

    // keyboard seek on the progress track
    progressTrack.addEventListener('keydown', (e) => {
        if (!audioPlayer.duration || isNaN(audioPlayer.duration)) return;
        const step = audioPlayer.duration * 0.05;
        if (e.key === 'ArrowLeft') { e.preventDefault(); audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - step); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + step); }
        else if (e.key === 'Home') { e.preventDefault(); audioPlayer.currentTime = 0; }
        else if (e.key === 'End') { e.preventDefault(); audioPlayer.currentTime = audioPlayer.duration; }
    });

    /* ---- volume ---- */
    function updateVolumeIconSafe() {
        const v = audioPlayer.muted ? 0 : audioPlayer.volume;
        let html;
        if (v === 0) html = ICON_VOL_MUTE;
        else if (v < 0.5) html = ICON_VOL_LOW;
        else html = ICON_VOL_HIGH;
        const wrapper = muteBtn;
        wrapper.innerHTML = html;
    }

    volumeSlider.addEventListener('input', (e) => {
        const v = parseFloat(e.target.value);
        audioPlayer.volume = v;
        audioPlayer.muted = (v === 0);
        if (v > 0) lastVolume = v;
        updateVolumeIconSafe();
    });

    function toggleMute() {
        if (audioPlayer.muted || audioPlayer.volume === 0) {
            audioPlayer.muted = false;
            audioPlayer.volume = lastVolume || 1;
            volumeSlider.value = audioPlayer.volume;
        } else {
            lastVolume = audioPlayer.volume;
            audioPlayer.muted = true;
            volumeSlider.value = 0;
        }
        updateVolumeIconSafe();
    }
    muteBtn.addEventListener('click', toggleMute);
    updateVolumeIconSafe();

    /* ---- global keyboard shortcuts ---- */
    document.addEventListener('keydown', (e) => {
        const tag = (e.target.tagName || '').toUpperCase();
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
        if (e.target === progressTrack) return; // handled above
        switch (e.code) {
            case 'Space':
                e.preventDefault();
                togglePlay();
                break;
            case 'ArrowLeft':
                e.preventDefault();
                if (audioPlayer.duration) audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5);
                break;
            case 'ArrowRight':
                e.preventDefault();
                if (audioPlayer.duration) audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 5);
                break;
            case 'ArrowUp':
                e.preventDefault();
                audioPlayer.volume = Math.min(1, audioPlayer.volume + 0.1);
                if (audioPlayer.muted) { audioPlayer.muted = false; }
                volumeSlider.value = audioPlayer.volume;
                updateVolumeIconSafe();
                break;
            case 'ArrowDown':
                e.preventDefault();
                audioPlayer.volume = Math.max(0, audioPlayer.volume - 0.1);
                volumeSlider.value = audioPlayer.volume;
                updateVolumeIconSafe();
                break;
            case 'KeyM':
                e.preventDefault();
                toggleMute();
                break;
        }
    });

    /* =========================================================
       PLAYLIST FETCH + RENDER
       ========================================================= */
    async function fetchMusicFiles() {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch data. Check configuration.');
            const files = await response.json();
            librarySongs = files.filter(file => {
                if (file.type !== 'file') return false;
                const fileNameLower = file.name.toLowerCase();
                return supportedExtensions.some(ext => fileNameLower.endsWith(ext));
            });
            if (librarySongs.length === 0) {
                statusElement.innerText = 'No music files found.';
                return;
            }
            statusElement.style.display = 'none';

            // load saved playlist from localStorage, or default to entire library
            const saved = loadSavedPlaylist();
            songsList = (saved && saved.length) ? saved : [...librarySongs];
            currentTrackIndex = 0;

            renderPlaylist();
            renderLibrary();
            updateCounts();
            if (songsList.length) loadTrack(0);
        } catch (error) {
            statusElement.innerText = 'Error: ' + error.message;
            console.error(error);
        }
    }

    function parseSongData(filename) {
        const songNameClean = filename.replace(/\.[^/.]+$/, '');
        let artist = 'unknown artist';
        let title = songNameClean;
        if (songNameClean.includes(' - ')) {
            const parts = songNameClean.split(' - ');
            artist = parts[0].trim();
            title = parts[1].trim();
        }
        return { title, artist };
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderPlaylist() {
        playlistElement.innerHTML = '';
        if (songsList.length === 0) {
            const empty = document.createElement('li');
            empty.className = 'empty-state';
            empty.style.cursor = 'default';
            empty.innerHTML = 'playlist is empty — switch to the library tab to add songs';
            playlistElement.appendChild(empty);
        } else {
            songsList.forEach((song, index) => {
                const li = document.createElement('li');
                li.setAttribute('data-index', index);
                const { title, artist } = parseSongData(song.name);
                li.innerHTML = `
                    <div class="song-title-wrapper">
                        <span class="eq-mini" aria-hidden="true"><span></span><span></span><span></span></span>
                        <span class="song-index">${index + 1}</span>
                        <span class="song-title">${escapeHtml(title)}</span>
                    </div>
                    <div class="song-row-right">
                        <span class="song-artist">${escapeHtml(artist)}</span>
                        <button class="row-action-btn" data-action="remove" aria-label="Remove from playlist" title="Remove from playlist">${ICON_REMOVE}</button>
                    </div>
                `;
                li.addEventListener('click', (e) => {
                    if (e.target.closest('[data-action="remove"]')) return;
                    currentTrackIndex = index;
                    playTrack(currentTrackIndex);
                });
                li.querySelector('[data-action="remove"]').addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeFromPlaylist(index);
                });
                playlistElement.appendChild(li);
            });
        }
        highlightActiveTrack();
        updatePlayerControlsEnabled();
    }

    function highlightActiveTrack() {
        const allItems = playlistElement.querySelectorAll('li[data-index]');
        allItems.forEach(item => item.classList.remove('active'));
        if (currentTrackIndex >= 0 && currentTrackIndex < songsList.length) {
            const activeItem = playlistElement.querySelector(`li[data-index="${currentTrackIndex}"]`);
            if (activeItem) activeItem.classList.add('active');
        }
    }

    function loadTrack(index) {
        if (!songsList.length || index < 0 || index >= songsList.length) return;
        playingLibraryIndex = -1; // switch to playlist playback mode
        const song = songsList[index];
        const { title, artist } = parseSongData(song.name);
        audioPlayer.src = song.download_url;
        nowPlayingElement.innerText = title;
        nowPlayingArtistElement.innerText = artist;
        updateDocumentTitle(title, artist);
        highlightActiveTrack();
        highlightActiveLibraryTrack();
    }

    function playTrack(index) {
        loadTrack(index);
        resumeAudioContext();
        audioPlayer.play().catch(error => {
            console.log('Autoplay blocked.', error);
            statusElement.style.display = 'block';
            statusElement.innerText = 'Click play to start.';
        });
        statusElement.style.display = 'none';
    }

    audioPlayer.addEventListener('ended', () => {
        if (playingLibraryIndex >= 0) {
            // library playback mode
            if (repeatMode === 'one') {
                playFromLibrary(playingLibraryIndex);
            } else if (isShuffle) {
                let r;
                do { r = Math.floor(Math.random() * librarySongs.length); }
                while (librarySongs.length > 1 && r === playingLibraryIndex);
                playFromLibrary(r);
            } else {
                if (playingLibraryIndex < librarySongs.length - 1) {
                    playFromLibrary(playingLibraryIndex + 1);
                } else if (repeatMode === 'all') {
                    playFromLibrary(0);
                } else {
                    nowPlayingElement.innerText = 'library finished.';
                    nowPlayingArtistElement.innerText = '';
                    updateDocumentTitle('', '');
                }
            }
            return;
        }
        if (repeatMode === 'one') {
            playTrack(currentTrackIndex);
        } else if (isShuffle) {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * songsList.length);
            } while (songsList.length > 1 && randomIndex === currentTrackIndex);
            currentTrackIndex = randomIndex;
            playTrack(currentTrackIndex);
        } else {
            if (currentTrackIndex < songsList.length - 1) {
                currentTrackIndex++;
                playTrack(currentTrackIndex);
            } else if (repeatMode === 'all') {
                currentTrackIndex = 0;
                playTrack(currentTrackIndex);
            } else {
                nowPlayingElement.innerText = 'playlist finished.';
                nowPlayingArtistElement.innerText = '';
                updateDocumentTitle('', '');
            }
        }
    });

    shuffleBtn.addEventListener('click', () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle('active', isShuffle);
    });

    repeatBtn.addEventListener('click', () => {
        if (repeatMode === 'none') {
            repeatMode = 'all';
            repeatBtn.innerHTML = 'repeat: all';
            repeatBtn.classList.add('active');
        } else if (repeatMode === 'all') {
            repeatMode = 'one';
            repeatBtn.innerHTML = 'repeat: one';
            repeatBtn.classList.add('active');
        } else {
            repeatMode = 'none';
            repeatBtn.innerHTML = 'repeat: no';
            repeatBtn.classList.remove('active');
        }
    });

    /* =========================================================
       PLAYLIST MANAGEMENT (library catalog → user playlist)
       Only songs already in the repo can be added. No uploads,
       no external URLs — the catalog is the single source.
       ========================================================= */
    function playFromLibrary(libraryIndex) {
        if (libraryIndex < 0 || libraryIndex >= librarySongs.length) return;
        playingLibraryIndex = libraryIndex;
        const song = librarySongs[libraryIndex];
        resumeAudioContext();
        audioPlayer.src = song.download_url;
        const { title, artist } = parseSongData(song.name);
        nowPlayingElement.innerText = title;
        nowPlayingArtistElement.innerText = artist;
        updateDocumentTitle(title, artist);
        // clear playlist highlight (playing directly from library, not the playlist queue)
        document.querySelectorAll('#playlist li[data-index]').forEach(li => li.classList.remove('active'));
        highlightActiveLibraryTrack();
        audioPlayer.play().catch(error => {
            console.log('Autoplay blocked.', error);
            statusElement.style.display = 'block';
            statusElement.innerText = 'Click play to start.';
        });
        statusElement.style.display = 'none';
    }

    function highlightActiveLibraryTrack() {
        document.querySelectorAll('#library li[data-lib-index]').forEach(li => li.classList.remove('active'));
        if (playingLibraryIndex >= 0) {
            const activeItem = libraryElement.querySelector(`li[data-lib-index="${playingLibraryIndex}"]`);
            if (activeItem) activeItem.classList.add('active');
        }
    }

    function updatePlayerControlsEnabled() {
        // enable transport controls if there is anything to play (playlist or library)
        const hasContent = songsList.length > 0 || librarySongs.length > 0;
        playBtn.disabled = !hasContent;
        prevBtn.disabled = !hasContent;
        nextBtn.disabled = !hasContent;
        if (hasContent) {
            prevBtn.title = 'Previous track';
            nextBtn.title = 'Next track';
            playBtn.title = 'Play (Space)';
        }
    }

    function renderLibrary() {
        libraryElement.innerHTML = '';
        if (librarySongs.length === 0) {
            const empty = document.createElement('li');
            empty.className = 'empty-state';
            empty.style.cursor = 'default';
            empty.innerHTML = 'library is empty';
            libraryElement.appendChild(empty);
            updatePlayerControlsEnabled();
            return;
        }
        const playlistUrls = new Set(songsList.map(s => s.download_url));
        librarySongs.forEach((song, index) => {
            const li = document.createElement('li');
            li.setAttribute('data-lib-index', index);
            const { title, artist } = parseSongData(song.name);
            const inPlaylist = playlistUrls.has(song.download_url);
            li.innerHTML = `
                <div class="song-title-wrapper">
                    <span class="song-index">${index + 1}</span>
                    <span class="song-title">${escapeHtml(title)}</span>
                </div>
                <div class="song-row-right">
                    <span class="song-artist">${escapeHtml(artist)}</span>
                    <button class="row-action-btn ${inPlaylist ? 'added' : ''}" data-action="add" ${inPlaylist ? 'disabled' : ''} aria-label="${inPlaylist ? 'Already in playlist' : 'Add to playlist'}" title="${inPlaylist ? 'Already in playlist' : 'Add to playlist'}">${inPlaylist ? ICON_CHECK : ICON_PLUS}</button>
                </div>
            `;
            // click the row → play the song directly (does NOT add to playlist)
            li.addEventListener('click', (e) => {
                if (e.target.closest('[data-action="add"]')) return;
                playFromLibrary(index);
            });
            // click the + button → add to playlist
            if (!inPlaylist) {
                const btn = li.querySelector('[data-action="add"]');
                btn.addEventListener('click', (e) => { e.stopPropagation(); addToPlaylist(song); });
            }
            libraryElement.appendChild(li);
        });
        highlightActiveLibraryTrack();
        updatePlayerControlsEnabled();
    }

    function addToPlaylist(song) {
        if (songsList.some(s => s.download_url === song.download_url)) return;
        const wasEmpty = songsList.length === 0;
        songsList.push(song);
        savePlaylist();
        renderPlaylist();
        renderLibrary();
        updateCounts();
        // only auto-load the first track if nothing else is playing/loaded
        if (wasEmpty && playingLibraryIndex < 0 && !audioPlayer.src) {
            currentTrackIndex = songsList.length - 1;
            loadTrack(currentTrackIndex);
        }
    }

    function removeFromPlaylist(index) {
        if (index < 0 || index >= songsList.length) return;
        const wasCurrent = playingLibraryIndex < 0 && index === currentTrackIndex;
        const wasPlaying = !audioPlayer.paused;
        songsList.splice(index, 1);

        if (songsList.length === 0) {
            // only stop audio if we were playing from the playlist (not library)
            if (playingLibraryIndex < 0) {
                audioPlayer.pause();
                audioPlayer.removeAttribute('src');
                audioPlayer.load();
                currentTrackIndex = 0;
                nowPlayingElement.innerText = 'playlist empty.';
                nowPlayingArtistElement.innerText = '';
                updateDocumentTitle('', '');
                setPlayingState(false);
            }
        } else if (wasCurrent) {
            if (currentTrackIndex >= songsList.length) currentTrackIndex = songsList.length - 1;
            if (wasPlaying) playTrack(currentTrackIndex);
            else loadTrack(currentTrackIndex);
        } else if (index < currentTrackIndex) {
            currentTrackIndex--;
        }
        savePlaylist();
        renderPlaylist();
        renderLibrary();
        updateCounts();
    }

    function switchTab(tab) {
        activeTab = tab;
        playlistTabs.forEach(t => {
            const isActive = t.dataset.tab === tab;
            t.classList.toggle('active', isActive);
            t.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
        playlistElement.classList.toggle('hidden', tab !== 'playlist');
        libraryElement.classList.toggle('hidden', tab !== 'library');
        playlistToolbar.classList.toggle('hidden', tab !== 'playlist');
        libraryToolbar.classList.toggle('hidden', tab !== 'library');
    }

    playlistTabs.forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    function updateCounts() {
        playlistCountEl.textContent = songsList.length;
        libraryCountEl.textContent = librarySongs.length;
    }

    function savePlaylist() {
        try {
            const urls = songsList.map(s => s.download_url);
            localStorage.setItem(PLAYLIST_STORAGE_KEY, JSON.stringify(urls));
        } catch (e) { /* ignore quota errors */ }
    }

    function loadSavedPlaylist() {
        try {
            const raw = localStorage.getItem(PLAYLIST_STORAGE_KEY);
            if (!raw) return null;
            const urls = JSON.parse(raw);
            if (!Array.isArray(urls)) return null;
            const map = new Map(librarySongs.map(s => [s.download_url, s]));
            const result = urls.map(u => map.get(u)).filter(Boolean);
            return result.length ? result : null;
        } catch (e) { return null; }
    }

    addAllBtn.addEventListener('click', () => {
        const wasEmpty = songsList.length === 0;
        const nothingPlaying = playingLibraryIndex < 0 && !audioPlayer.src;
        let added = false;
        librarySongs.forEach(song => {
            if (!songsList.some(s => s.download_url === song.download_url)) {
                songsList.push(song);
                added = true;
            }
        });
        if (added) {
            savePlaylist();
            renderPlaylist();
            renderLibrary();
            updateCounts();
            // if playlist was empty and nothing is loaded yet, prep the first track
            if (wasEmpty && nothingPlaying && songsList.length) {
                currentTrackIndex = 0;
                loadTrack(0);
            }
        }
    });

    clearBtn.addEventListener('click', () => {
        if (!songsList.length) return;
        // only stop audio if playing from the playlist (library playback continues)
        if (playingLibraryIndex < 0) {
            audioPlayer.pause();
            audioPlayer.removeAttribute('src');
            audioPlayer.load();
            nowPlayingElement.innerText = 'playlist empty.';
            nowPlayingArtistElement.innerText = '';
            updateDocumentTitle('', '');
            setPlayingState(false);
        }
        songsList = [];
        currentTrackIndex = 0;
        savePlaylist();
        renderPlaylist();
        renderLibrary();
        updateCounts();
    });

    resetBtn.addEventListener('click', () => {
        if (!librarySongs.length) return;
        songsList = [...librarySongs];
        currentTrackIndex = 0;
        savePlaylist();
        renderPlaylist();
        renderLibrary();
        updateCounts();
        loadTrack(0);
    });

    /* =========================================================
       WAKE LOCK (kept intact from original)
       ========================================================= */
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLockSentinel = await navigator.wakeLock.request('screen');
                wakeLockSentinel.addEventListener('release', () => {
                    if (!isKeepAwakeEnabled) updateWakeLockUI(false);
                });
                updateWakeLockUI(true);
            } else {
                alert('Browser not supporting Wake Lock.');
                isKeepAwakeEnabled = false;
                updateWakeLockUI(false);
            }
        } catch (err) {
            isKeepAwakeEnabled = false;
            updateWakeLockUI(false);
        }
    }

    function releaseWakeLock() {
        if (wakeLockSentinel) {
            wakeLockSentinel.release();
            wakeLockSentinel = null;
        }
        updateWakeLockUI(false);
    }

    function updateWakeLockUI(active) {
        if (active) {
            wakeLockBtn.innerHTML = 'keep awake: on';
            wakeLockBtn.classList.add('active');
        } else {
            wakeLockBtn.innerHTML = 'keep awake: off';
            wakeLockBtn.classList.remove('active');
        }
    }

    wakeLockBtn.addEventListener('click', () => {
        isKeepAwakeEnabled = !isKeepAwakeEnabled;
        if (isKeepAwakeEnabled) requestWakeLock();
        else releaseWakeLock();
    });

    document.addEventListener('visibilitychange', async () => {
        if (wakeLockSentinel !== null && document.visibilityState === 'visible' && isKeepAwakeEnabled) {
            requestWakeLock();
        }
    });

    // init
    fetchMusicFiles();
</script>

</body>
</html>
